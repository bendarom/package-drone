# Expected FC parameters on the real drone (run_mode: real and shadow).
# Format and rules: docs/PARAMS.md. Read-only check: nothing here is ever written.
#
# value: null = TBD. The check reports TBD and does not pass until every value is
# filled in. TBD values get proposed from your Mission Planner dump
# (params/fc_current.param) and confirmed by you before they go in here.
params:
  - name: MAV_SYSID
    value: 1
    reason: mission code talks to sysid 1 (config connection.sysid); renamed from SYSID_THISMAV in 4.7

  # TFmini Plus on an FC UART.
  - name: RNGFND1_TYPE
    value: 20
    reason: Benewake serial driver (TFmini / TFmini Plus on a UART)
  - name: RNGFND1_ORIENT
    value: 25
    reason: rangefinder must face down (pitch 270) for DISTANCE_SENSOR orientation 25
  - name: RNGFND1_MIN
    value: 0.1
    tolerance: 0.001
    reason: TFmini Plus blind zone, matches config rangefinder.min_valid_m
  - name: RNGFND1_MAX
    value: 12
    tolerance: 0.001
    reason: TFmini Plus rated range

  - name: EK3_SRC1_POSZ
    value: 1
    reason: EKF height source must be baro, never the rangefinder (hard rule)
  - name: EK3_RNG_USE_HGT
    value: -1
    reason: EKF must not switch to rangefinder height at low altitude (hard rule)

  - name: RALLY_TOTAL
    value: 1
    op: ge
    reason: ArduPilot RTL must go to a rally point in open ground, not the balcony
  - name: RALLY_INCL_HOME
    value: 0
    reason: RTL must not pick home (the balcony) over the rally point

  - name: GUID_TIMEOUT
    value: null   # TBD from dump
    reason: GUIDED stops on its own this long after the last velocity command (Pi dies -> drone holds)
  - name: DISARM_DELAY
    value: null   # TBD from dump; also measured against contact detection in SITL
    reason: auto-disarm delay after landing; contact detection must start the climb well before it
  - name: FS_THR_ENABLE
    value: null   # TBD from dump
    reason: RC-loss failsafe must be enabled
  - name: FS_EKF_ACTION
    value: null   # TBD from dump
    reason: EKF failsafe action
  - name: FS_GCS_ENABLE
    value: null   # TBD from dump
    reason: GCS (telemetry radio) failsafe behaviour; the Pi (sysid 1, compid 191) is not a GCS
  - name: BATT_FS_LOW_ACT
    value: null   # TBD from dump
    reason: FC battery failsafe is the backstop for the low-battery case
  - name: BATT_FS_CRT_ACT
    value: null   # TBD from dump
    reason: FC critical-battery failsafe action
  - name: BATT_LOW_VOLT
    value: null   # TBD from dump; must be below config battery_gps.return_v
    reason: FC low-battery threshold
  - name: ARMING_SKIPCHK
    value: null   # TBD from dump (0 = all pre-arm checks enabled)
    reason: pre-arm checks; renamed from ARMING_CHECK in 4.7

  # TBD: FC serial port numbers aren't known yet, so these can't be listed by name.
  # Once known, add (n = Pi port, m = lidar port):
  #   - {name: SERIALn_PROTOCOL, value: 2,   reason: Pi link is MAVLink 2}
  #   - {name: SERIALn_BAUD,     value: 921, reason: Pi link at 921600 baud}
  #   - {name: SERIALm_PROTOCOL, value: 9,   reason: lidar port is a rangefinder}
  #   - {name: SERIALm_BAUD,     value: 115, reason: TFmini Plus default 115200 baud}
